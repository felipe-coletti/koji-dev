# Builds Koji from the seed and runs its tests (written in Koji) on each push and pull request, on
# each platform it supports, on that platform (Windows: the programs of the cases), and packs the
# release of each platform (bootstrap/package.sh) as an artifact. The tests must pass on all of
# them.
name: CI

on:
  push:
  pull_request:

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install valgrind (the tests run the built programs under it) and Wine
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind wine64
      - name: Build kojic from the seed
        run: sh bootstrap/build.sh
      - name: Test
        run: build/kojic test test/*.kj
      - name: Test the programs built for Windows, under Wine
        run: KOJI_TEST_WINDOWS=1 build/kojic test test/cases.kj test/language.kj
      - name: Pack the release of each platform
        run: sh bootstrap/package.sh
      - uses: actions/upload-artifact@v5
        with:
          name: koji-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  other-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
          - name: macos-x64
            os: macos-15-intel
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build kojic from the seed
        run: sh bootstrap/build.sh
      - name: Run an example
        run: build/kojic run examples/hello.kj
      - name: Test
        run: build/kojic test test/*.kj

  windows-x64:
    name: windows-x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build kojic from the seed
        shell: cmd
        run: bootstrap\build.cmd
      - name: Run an example
        shell: cmd
        run: build\kojic.exe run examples\hello.kj
      - name: Test the programs of the cases
        shell: bash
        run: build/kojic.exe test test/cases.kj
